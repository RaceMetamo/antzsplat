<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBG — Roots — Midroom</title>
<style>
  :root {
    --ink: #e8e5df;
    --void: #0a0908;
    --concrete: #37342f;
    --accent: #8f6a4a;
    --dim: #8a857c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 28px 32px;
    pointer-events: none;
    z-index: 5;
  }
  #hud .label {
    pointer-events: auto;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .title {
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  #reset-btn {
    pointer-events: auto;
    background: transparent;
    border: 1px solid var(--concrete);
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  #reset-btn:hover {
    border-color: var(--accent);
    color: var(--ink);
  }
  #reset-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--void);
    z-index: 10;
    transition: opacity 0.6s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading .mark {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #bar-track {
    width: 180px;
    height: 1px;
    background: var(--concrete);
    position: relative;
  }
  #bar-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s ease;
  }
  #pct {
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  #error {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--void);
    z-index: 10;
    text-align: center;
    padding: 24px;
  }
  #error .mark { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  #error p { font-size: 13px; color: var(--dim); max-width: 320px; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    #loading { transition: none; }
  }

  @media (max-width: 600px) {
    #hud { padding: 18px 18px; }
    .title { font-size: 13px; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="hud">
  <div class="label">
    <div class="eyebrow">The Bridge Gallery</div>
    <div class="title">Antz — Figure Showcase</div>
  </div>
  <button id="reset-btn" type="button">Reset view</button>
</div>

<div id="loading">
  <div class="mark">Loading scan</div>
  <div id="bar-track"><div id="bar-fill"></div></div>
  <div id="pct">0%</div>
</div>

<div id="error">
  <div class="mark">Scan unavailable</div>
  <p>The 3D scan couldn't be loaded. Check that the .spz file path is correct and try refreshing.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

  // ---- Configuration -------------------------------------------------
  // Swap this path per exhibition/room. Keep the .spz alongside this file,
  // or point it at wherever the studio hosts exhibition assets.
  const SPLAT_URL = "./splats/AntzSPZ.spz";

  // Starting camera position — tune per scene once you see the splat load.
  const START_POS = new THREE.Vector3(0, 1.2, 3.2);
  const START_TARGET = new THREE.Vector3(0, 0.6, 0);
  // ---------------------------------------------------------------------

  const wrap = document.getElementById("canvas-wrap");
  const loadingEl = document.getElementById("loading");
  const errorEl = document.getElementById("error");
  const barFill = document.getElementById("bar-fill");
  const pctEl = document.getElementById("pct");
  const resetBtn = document.getElementById("reset-btn");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.01, 1000
  );
  camera.position.copy(START_POS);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrap.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(START_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 12;
  controls.update();

  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  let splat;
  try {
    splat = new SplatMesh({
      url: SPLAT_URL,
      onProgress: (ratio) => {
        const pct = Math.round(ratio * 100);
        barFill.style.width = pct + "%";
        pctEl.textContent = pct + "%";
      },
    });
    scene.add(splat);

    splat.initialized
      .then(() => {
        loadingEl.classList.add("hidden");
      })
      .catch((err) => {
        console.error("Splat failed to initialize:", err);
        loadingEl.style.display = "none";
        errorEl.style.display = "flex";
      });
  } catch (err) {
    console.error("Splat failed to load:", err);
    loadingEl.style.display = "none";
    errorEl.style.display = "flex";
  }

  resetBtn.addEventListener("click", () => {
    camera.position.copy(START_POS);
    controls.target.copy(START_TARGET);
    controls.update();
  });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
